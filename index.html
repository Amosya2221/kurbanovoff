<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Амир Курбанов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: #0a0a0a; color: #f5f5f5; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; display: flex; padding: 24px; position: relative; overflow-x: hidden; }

  /* Фон: плавающие светящиеся круги */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.35; will-change: transform; }
  .orb.o1 { width: 340px; height: 340px; background: #6a5cff; top: -80px; left: -100px; animation: float1 18s ease-in-out infinite; }
  .orb.o2 { width: 300px; height: 300px; background: #ff5c8a; bottom: -90px; right: -80px; animation: float2 22s ease-in-out infinite; }
  .orb.o3 { width: 240px; height: 240px; background: #2ee6c5; top: 45%; left: 55%; opacity: 0.22; animation: float3 26s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,160px) scale(1.2); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-140px,-120px) scale(1.15); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-160px,100px) scale(0.85); } }

  .card { width: 100%; max-width: 380px; text-align: center; margin: auto; position: relative; z-index: 1; }

  /* Появление при открытии */
  .reveal { opacity: 0; transform: translateY(24px); animation: rise 0.8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }
  .d4 { animation-delay: 0.55s; } .d5 { animation-delay: 0.7s; } .d6 { animation-delay: 0.9s; } .d7 { animation-delay: 1.1s; }

  /* Аватар с пульсирующим кольцом */
  .avatar-wrap { position: relative; width: 132px; height: 132px; margin: 0 auto 22px; }
  .avatar-wrap::before, .avatar-wrap::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid #6a5cff; opacity: 0; animation: pulse 3s ease-out infinite; }
  .avatar-wrap::after { animation-delay: 1.5s; border-color: #2ee6c5; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.55); opacity: 0; } }
  .avatar { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 2px solid #333; background: #1a1a1a; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 { font-size: 22px; font-weight: 600; }
  p { color: #9a9a9a; margin: 10px 0 32px; line-height: 1.6; font-size: 14px; }

  a.btn { display: block; padding: 15px; margin-bottom: 14px; border: 1px solid #3a3a3a; border-radius: 10px; color: #f5f5f5; text-decoration: none; font-size: 15px; background: rgba(10,10,10,0.5); backdrop-filter: blur(6px); transition: transform 0.25s, background 0.25s, color 0.25s, box-shadow 0.25s; }
  a.btn:hover, a.btn:focus-visible { background: #f5f5f5; color: #0a0a0a; outline: none; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(106,92,255,0.35); }

  /* Галерея: фото и видео */
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 34px; }
  .gallery + .gallery { margin-top: 10px; }
  .gallery img, .gallery video { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; border: 1px solid #2a2a2a; border-radius: 10px; background: #1a1a1a; transition: transform 0.3s, border-color 0.3s; }
  .gallery img:hover, .gallery video:hover { transform: scale(1.03); border-color: #555; }
  .gallery.videos video { aspect-ratio: 1 / 1; }

  /* Если у человека включено «уменьшить движение» */
  @media (prefers-reduced-motion: reduce) {
    .orb, .avatar-wrap::before, .avatar-wrap::after { animation: none; }
    .reveal { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>

  <div class="card">
    <div class="avatar-wrap reveal d1">
      <div class="avatar"><img src="photo.jpg" alt="Амир Курбанов"></div>
    </div>
    <h1 class="reveal d2">Амир Курбанов</h1>
    <p class="reveal d3">Фото, идеи и всё, что вдохновляет. Есть в Telegram, смотри в Instagram.</p>
    <a class="btn reveal d4" href="https://www.instagram.com/am1rkurbanov">Instagram</a>
    <a class="btn reveal d5" href="https://t.me/kurbanovoff">Telegram</a>

    <!-- Фото -->
    <div class="gallery reveal d6">
      <img src="media/photo1.jpg" alt="Кубок Qazaqstan Brewers Cup, 2 место" loading="lazy">
      <img src="media/photo2.jpg" alt="Амир Курбанов" loading="lazy">
    </div>

    <!-- Мини-видео: сами запускаются без звука и крутятся по кругу -->
    <div class="gallery videos reveal d7">
      <video src="media/video1.mp4" autoplay muted loop playsinline preload="metadata"></video>
      <video src="media/video2.mp4" autoplay muted loop playsinline preload="metadata"></video>
      <video src="media/video3.mp4" autoplay muted loop playsinline preload="metadata"></video>
      <video src="media/video4.mp4" autoplay muted loop playsinline preload="metadata"></video>
    </div>
  </div>
</body>
</html>
